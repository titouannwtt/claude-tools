<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">claude-tools</title>
  <desc id="d">A pixel-art Claude mascot routes tasks from CLAUDE.md and SKILL.md files to Haiku, Sonnet and Opus while a token meter goes down.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .float { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 5s ease-in-out infinite -1.5s; }
      .float3 { animation: float 4.5s ease-in-out infinite -3s; }
      .eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
      .flow { stroke-dasharray: 2 10; stroke-linecap: round; animation: dash 1.4s linear infinite; }
      .meter { animation: meter 6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
      .spark { animation: twinkle 3s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes meter { 0%, 15% { transform: scaleX(1); } 55%, 100% { transform: scaleX(0.32); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <radialGradient id="glow" cx="0.7" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1E1C"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="11" y="11" width="2" height="2" fill="#F0EEE6" opacity="0.06"/>
    </pattern>
    <!-- Pixel mascot on an 11 x 6 grid, one unit per pixel -->
    <g id="clawd" shape-rendering="crispEdges">
      <rect x="2" y="0" width="7" height="4" fill="#D97757"/>
      <rect x="0" y="2" width="2" height="1" fill="#D97757"/>
      <rect x="9" y="2" width="2" height="1" fill="#D97757"/>
      <rect x="2" y="4" width="1" height="2" fill="#D97757"/>
      <rect x="4" y="4" width="1" height="2" fill="#D97757"/>
      <rect x="6" y="4" width="1" height="2" fill="#D97757"/>
      <rect x="8" y="4" width="1" height="2" fill="#D97757"/>
      <rect class="eye" x="3" y="1" width="1" height="1" fill="#141413"/>
      <rect class="eye" x="7" y="1" width="1" height="1" fill="#141413"/>
    </g>
    <g id="fileicon">
      <path d="M0 0h11l5 5v15H0z" fill="none" stroke="#D97757" stroke-width="2" stroke-linejoin="round"/>
      <path d="M11 0v5h5" fill="none" stroke="#D97757" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow)"/>

  <!-- Left: title -->
  <g class="sans">
    <text x="80" y="176" class="mono" font-size="20" letter-spacing="4" fill="#D97757">CLAUDE CODE TOOLKIT</text>
    <text x="76" y="262" font-size="88" font-weight="700" fill="#F0EEE6" letter-spacing="-2">claude-tools</text>
    <text x="80" y="324" font-size="30" fill="#F0EEE6">Fewer tokens. Same reliability.</text>
    <text x="80" y="366" font-size="21" fill="#A8A69E">Model routing, cost-aware agents and a box of</text>
    <text x="80" y="396" font-size="21" fill="#A8A69E">tested skills for Claude Code and claude.ai.</text>
  </g>

  <!-- Left: chips -->
  <g class="mono" font-size="18">
    <g transform="translate(80 448)">
      <rect width="132" height="44" rx="22" fill="#2A2926" stroke="#3D3B37"/>
      <text x="66" y="28" text-anchor="middle" fill="#F0EEE6"><tspan fill="#D97757">10</tspan> agents</text>
    </g>
    <g transform="translate(224 448)">
      <rect width="124" height="44" rx="22" fill="#2A2926" stroke="#3D3B37"/>
      <text x="62" y="28" text-anchor="middle" fill="#F0EEE6"><tspan fill="#D97757">8</tspan> skills</text>
    </g>
    <g transform="translate(360 448)">
      <rect width="176" height="44" rx="22" fill="#2A2926" stroke="#3D3B37"/>
      <text x="88" y="28" text-anchor="middle" fill="#F0EEE6"><tspan fill="#D97757">1</tspan> routing hook</text>
    </g>
    <g transform="translate(80 504)">
      <rect width="456" height="44" rx="22" fill="#2A2926" stroke="#3D3B37"/>
      <text x="228" y="28" text-anchor="middle" fill="#F0EEE6"><tspan fill="#D97757">0</tspan> model tokens for the scripted parts</text>
    </g>
  </g>

  <!-- Right: flows from mascot to models -->
  <g fill="none" stroke="#D97757" stroke-width="3" opacity="0.85">
    <path class="flow" d="M860 418 C 840 450, 760 450, 734 492"/>
    <path class="flow" d="M920 418 L 920 492"/>
    <path class="flow" d="M980 418 C 1000 450, 1080 450, 1106 492"/>
  </g>
  <g class="mono" font-size="19">
    <g transform="translate(648 492)">
      <rect width="172" height="64" rx="14" fill="#2A2926" stroke="#3D3B37"/>
      <text x="86" y="28" text-anchor="middle" fill="#F0EEE6" font-weight="700">Haiku</text>
      <text x="86" y="50" text-anchor="middle" fill="#A8A69E" font-size="14">scout · worker</text>
    </g>
    <g transform="translate(834 492)">
      <rect width="172" height="64" rx="14" fill="#2A2926" stroke="#3D3B37"/>
      <text x="86" y="28" text-anchor="middle" fill="#F0EEE6" font-weight="700">Sonnet</text>
      <text x="86" y="50" text-anchor="middle" fill="#A8A69E" font-size="14">implementer</text>
    </g>
    <g transform="translate(1020 492)">
      <rect width="172" height="64" rx="14" fill="#2A2926" stroke="#D97757"/>
      <text x="86" y="28" text-anchor="middle" fill="#F0EEE6" font-weight="700">Opus</text>
      <text x="86" y="50" text-anchor="middle" fill="#A8A69E" font-size="14">analyst · reviewer</text>
    </g>
  </g>

  <!-- Right: file cards -->
  <g transform="translate(668 116) rotate(-6)">
    <g class="float2">
      <rect width="200" height="128" rx="14" fill="#2A2926" stroke="#3D3B37"/>
      <use href="#fileicon" x="18" y="16"/>
      <text x="46" y="33" class="mono" font-size="17" fill="#F0EEE6">CLAUDE.md</text>
      <rect x="18" y="56" width="150" height="8" rx="4" fill="#4A4843"/>
      <rect x="18" y="74" width="110" height="8" rx="4" fill="#D97757" opacity="0.8"/>
      <rect x="18" y="92" width="164" height="8" rx="4" fill="#4A4843"/>
      <rect x="18" y="110" width="80" height="8" rx="4" fill="#4A4843"/>
    </g>
  </g>
  <g transform="translate(1036 96) rotate(5)">
    <g class="float3">
      <rect width="190" height="128" rx="14" fill="#2A2926" stroke="#3D3B37"/>
      <use href="#fileicon" x="18" y="16"/>
      <text x="46" y="33" class="mono" font-size="17" fill="#F0EEE6">SKILL.md</text>
      <rect x="18" y="56" width="70" height="8" rx="4" fill="#D97757" opacity="0.8"/>
      <rect x="96" y="56" width="74" height="8" rx="4" fill="#4A4843"/>
      <rect x="18" y="74" width="152" height="8" rx="4" fill="#4A4843"/>
      <rect x="18" y="92" width="120" height="8" rx="4" fill="#4A4843"/>
      <rect x="18" y="110" width="140" height="8" rx="4" fill="#4A4843"/>
    </g>
  </g>

  <!-- Token meter -->
  <g transform="translate(830 64)">
    <g class="float">
      <rect width="180" height="72" rx="14" fill="#2A2926" stroke="#3D3B37"/>
      <text x="18" y="30" class="mono" font-size="15" fill="#A8A69E">tokens / task</text>
      <text x="162" y="30" class="mono" font-size="17" fill="#D97757" text-anchor="end">&#8600;</text>
      <rect x="18" y="44" width="144" height="12" rx="6" fill="#3D3B37"/>
      <rect class="meter" x="18" y="44" width="144" height="12" rx="6" fill="#D97757"/>
    </g>
  </g>

  <!-- Mascot -->
  <ellipse cx="920" cy="410" rx="120" ry="10" fill="#000" opacity="0.35"/>
  <g transform="translate(799 260)">
    <g class="float"><g transform="scale(22)"><use href="#clawd"/></g></g>
  </g>

  <!-- Sparkles -->
  <g fill="#D97757">
    <rect class="spark" x="1140" y="300" width="8" height="8"/>
    <rect class="spark" x="700" y="330" width="6" height="6" style="animation-delay:-1s"/>
    <rect class="spark" x="1196" y="404" width="6" height="6" style="animation-delay:-2s"/>
    <rect class="spark" x="760" y="250" width="5" height="5" style="animation-delay:-0.5s"/>
  </g>
</svg>

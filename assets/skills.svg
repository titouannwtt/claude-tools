<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">The skill box</title>
  <desc id="d">The pixel mascot carries a toolbox; nine skills come out of it: light-research, skill-forge, video-transcript, youtube-download, web-fetch, site-design, mac-control, geo-seo and repo-showcase.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
      .bob { animation: bob 2.6s ease-in-out infinite; }
      .pop { animation: pop 2.6s ease-in-out infinite; }
      @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes pop { 0%, 100% { opacity: 0.2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-10px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .card { fill: #2A2926; stroke: #3D3B37; }
      .ic { fill: none; stroke: #D97757; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1E1C"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="11" y="11" width="2" height="2" fill="#F0EEE6" opacity="0.06"/>
    </pattern>
    <g id="clawd" shape-rendering="crispEdges">
      <rect x="2" y="0" width="7" height="4" fill="#D97757"/>
      <rect x="0" y="2" width="2" height="1" fill="#D97757"/>
      <rect x="9" y="2" width="2" height="1" fill="#D97757"/>
      <rect x="2" y="4" width="1" height="2" fill="#D97757"/>
      <rect x="4" y="4" width="1" height="2" fill="#D97757"/>
      <rect x="6" y="4" width="1" height="2" fill="#D97757"/>
      <rect x="8" y="4" width="1" height="2" fill="#D97757"/>
      <rect class="eye" x="3" y="1" width="1" height="1" fill="#141413"/>
      <rect class="eye" x="7" y="1" width="1" height="1" fill="#141413"/>
    </g>
  </defs>

  <rect width="1280" height="600" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="600" rx="28" fill="url(#dots)"/>

  <g class="sans">
    <text x="60" y="78" font-size="34" font-weight="700" fill="#F0EEE6">The skill box</text>
    <text x="60" y="114" font-size="20" fill="#A8A69E">Each skill calls a tested script. The model only steps in when the script fails.</text>
  </g>

  <!-- Mascot with toolbox -->
  <g transform="translate(70 280)">
    <g class="bob">
      <g transform="scale(13)"><use href="#clawd"/></g>
      <g shape-rendering="crispEdges">
        <rect x="143" y="26" width="58" height="13" fill="#D97757"/>
        <rect x="196" y="22" width="56" height="9" fill="#6B3A28"/>
        <rect x="196" y="22" width="9" height="28" fill="#6B3A28"/>
        <rect x="243" y="22" width="9" height="28" fill="#6B3A28"/>
        <rect x="160" y="48" width="132" height="80" rx="4" fill="#B65E3F"/>
        <rect x="160" y="48" width="132" height="20" rx="4" fill="#D97757"/>
        <rect x="160" y="68" width="132" height="4" fill="#6B3A28"/>
        <rect x="214" y="62" width="24" height="14" fill="#F0EEE6"/>
      </g>
    </g>
    <g fill="#D97757">
      <rect class="pop" x="196" y="-12" width="10" height="10"/>
      <rect class="pop" x="236" y="-26" width="8" height="8" style="animation-delay:-0.9s"/>
      <rect class="pop" x="270" y="-4" width="8" height="8" style="animation-delay:-1.7s"/>
    </g>
  </g>

  <!-- Cards: 3 x 3 -->
  <g class="sans">
    <!-- light-research -->
    <g transform="translate(432 160)">
      <rect class="card" width="248" height="118" rx="14"/>
      <circle class="ic" cx="30" cy="32" r="10"/><path class="ic" d="M37 39l8 8"/>
      <text x="18" y="76" class="mono" font-size="16" fill="#F0EEE6">light-research</text>
      <text x="18" y="100" font-size="14" fill="#A8A69E">big scope, Haiku batches</text>
    </g>
    <!-- skill-forge -->
    <g transform="translate(696 160)">
      <rect class="card" width="248" height="118" rx="14"/>
      <path class="ic" d="M18 24h30c0 6-5 9-11 9v6h6v6H23v-6h6v-6c-6 0-11-3-11-9z"/><path class="ic" d="M54 20l5-5M56 28h7"/>
      <text x="18" y="76" class="mono" font-size="16" fill="#F0EEE6">skill-forge</text>
      <text x="18" y="100" font-size="14" fill="#A8A69E">design and ship a skill</text>
    </g>
    <!-- video-transcript -->
    <g transform="translate(960 160)">
      <rect class="card" width="248" height="118" rx="14"/>
      <rect class="ic" x="18" y="20" width="30" height="24" rx="5"/><path d="M29 26v12l9-6z" fill="#D97757"/><path class="ic" d="M54 26h10M54 32h14M54 38h8"/>
      <text x="18" y="76" class="mono" font-size="16" fill="#F0EEE6">video-transcript</text>
      <text x="18" y="100" font-size="14" fill="#A8A69E">YouTube to text</text>
    </g>
    <!-- youtube-download -->
    <g transform="translate(432 292)">
      <rect class="card" width="248" height="118" rx="14"/>
      <path class="ic" d="M32 18v20M24 31l8 8 8-8M20 46h24"/>
      <text x="18" y="76" class="mono" font-size="16" fill="#F0EEE6">youtube-download</text>
      <text x="18" y="100" font-size="14" fill="#A8A69E">video, audio, thumbnail</text>
    </g>
    <!-- web-fetch -->
    <g transform="translate(696 292)">
      <rect class="card" width="248" height="118" rx="14"/>
      <circle class="ic" cx="31" cy="32" r="13"/><path class="ic" d="M18 32h26M31 19c-7 8-7 18 0 26M31 19c7 8 7 18 0 26"/>
      <text x="18" y="76" class="mono" font-size="16" fill="#F0EEE6">web-fetch</text>
      <text x="18" y="100" font-size="14" fill="#A8A69E">pages, with proxy fallback</text>
    </g>
    <!-- site-design -->
    <g transform="translate(960 292)">
      <rect class="card" width="248" height="118" rx="14"/>
      <rect x="18" y="20" width="12" height="24" rx="3" fill="#D97757"/><rect x="34" y="20" width="12" height="24" rx="3" fill="#B65E3F"/><rect x="50" y="20" width="12" height="24" rx="3" fill="#F0EEE6"/><rect x="66" y="20" width="12" height="24" rx="3" fill="#4A4843"/>
      <text x="18" y="76" class="mono" font-size="16" fill="#F0EEE6">site-design</text>
      <text x="18" y="100" font-size="14" fill="#A8A69E">palette, type, responsive</text>
    </g>
    <!-- mac-control -->
    <g transform="translate(432 424)">
      <rect class="card" width="248" height="118" rx="14"/>
      <path d="M22 18l18 16-8 1 5 10-4 2-5-10-6 6z" fill="#D97757"/>
      <text x="18" y="76" class="mono" font-size="16" fill="#F0EEE6">mac-control</text>
      <text x="18" y="100" font-size="14" fill="#A8A69E">drive apps and forms</text>
    </g>
    <!-- geo-seo -->
    <g transform="translate(696 424)">
      <rect class="card" width="248" height="118" rx="14"/>
      <path class="ic" d="M18 46h44"/><rect x="22" y="34" width="8" height="12" rx="2" fill="#4A4843"/><rect x="34" y="27" width="8" height="19" rx="2" fill="#B65E3F"/><rect x="46" y="18" width="8" height="28" rx="2" fill="#D97757"/>
      <text x="18" y="76" class="mono" font-size="16" fill="#F0EEE6">geo-seo</text>
      <text x="18" y="100" font-size="14" fill="#A8A69E">rank on Google and AIs</text>
    </g>
    <!-- repo-showcase -->
    <g transform="translate(960 424)">
      <rect class="card" width="248" height="118" rx="14"/>
      <rect class="ic" x="18" y="20" width="34" height="26" rx="4"/><path class="ic" d="M23 41l8-9 6 6 4-4 6 7"/><path d="M62 13l2.5 5.5L70 21l-5.5 2.5L62 29l-2.5-5.5L54 21l5.5-2.5z" fill="#D97757"/>
      <text x="18" y="76" class="mono" font-size="16" fill="#F0EEE6">repo-showcase</text>
      <text x="18" y="100" font-size="14" fill="#A8A69E">safe, visual, publish-ready</text>
    </g>
  </g>
</svg>

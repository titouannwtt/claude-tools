<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
  <title id="t">Pay for judgment, not for reading</title>
  <desc id="d">A script splits a large repository into batches at zero model tokens, small Haiku agents read the batches in parallel, and Opus only writes the synthesis.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 2 10; stroke-linecap: round; animation: dash 1.4s linear infinite; }
      .eye { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
      .hop1 { animation: hop 1.2s ease-in-out infinite; }
      .hop2 { animation: hop 1.2s ease-in-out infinite -0.4s; }
      .hop3 { animation: hop 1.2s ease-in-out infinite -0.8s; }
      .think { animation: think 1.5s ease-in-out infinite; }
      .cursor { animation: cursor 1s steps(1) infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
      @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes think { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
      @keyframes cursor { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1E1C"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="11" y="11" width="2" height="2" fill="#F0EEE6" opacity="0.06"/>
    </pattern>
    <g id="clawd" shape-rendering="crispEdges">
      <rect x="2" y="0" width="7" height="4" fill="#D97757"/>
      <rect x="0" y="2" width="2" height="1" fill="#D97757"/>
      <rect x="9" y="2" width="2" height="1" fill="#D97757"/>
      <rect x="2" y="4" width="1" height="2" fill="#D97757"/>
      <rect x="4" y="4" width="1" height="2" fill="#D97757"/>
      <rect x="6" y="4" width="1" height="2" fill="#D97757"/>
      <rect x="8" y="4" width="1" height="2" fill="#D97757"/>
      <rect class="eye" x="3" y="1" width="1" height="1" fill="#141413"/>
      <rect class="eye" x="7" y="1" width="1" height="1" fill="#141413"/>
    </g>
    <g id="file">
      <path d="M0 0h40l14 14v52H0z" fill="#2A2926" stroke="#4A4843" stroke-width="2" stroke-linejoin="round"/>
      <path d="M40 0v14h14" fill="none" stroke="#4A4843" stroke-width="2" stroke-linejoin="round"/>
      <rect x="9" y="26" width="34" height="5" rx="2.5" fill="#4A4843"/>
      <rect x="9" y="38" width="24" height="5" rx="2.5" fill="#4A4843"/>
      <rect x="9" y="50" width="30" height="5" rx="2.5" fill="#4A4843"/>
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#D97757"/>
    </marker>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#dots)"/>

  <g class="sans">
    <text x="60" y="78" font-size="34" font-weight="700" fill="#F0EEE6">Pay for judgment, not for reading</text>
    <text x="60" y="114" font-size="20" fill="#A8A69E">Scripts do the mechanical work, cheap models read, the expensive model only decides. Example: light-research.</text>
  </g>

  <!-- Stage 1: files -->
  <g transform="translate(70 186)">
    <use href="#file" x="0" y="34"/>
    <use href="#file" x="36" y="14"/>
    <use href="#file" x="72" y="0"/>
    <use href="#file" x="54" y="62"/>
    <use href="#file" x="108" y="40"/>
  </g>
  <g class="sans" text-anchor="middle">
    <text x="165" y="350" font-size="19" fill="#F0EEE6" font-weight="600">A vague, huge scope</text>
    <text x="165" y="376" font-size="16" fill="#A8A69E">“audit the whole repo”</text>
  </g>

  <!-- Stage 2: script -->
  <g transform="translate(330 176)">
    <rect width="252" height="146" rx="14" fill="#191917" stroke="#3D3B37"/>
    <circle cx="20" cy="20" r="5" fill="#4A4843"/><circle cx="36" cy="20" r="5" fill="#4A4843"/><circle cx="52" cy="20" r="5" fill="#4A4843"/>
    <g class="mono" font-size="15">
      <text x="18" y="56" fill="#F0EEE6"><tspan fill="#D97757">$</tspan> plan_batches.py</text>
      <text x="18" y="84" fill="#A8A69E">batch 1   ~25k tokens</text>
      <text x="18" y="106" fill="#A8A69E">batch 2   ~25k tokens</text>
      <text x="18" y="128" fill="#A8A69E">batch 3   ~20k tokens</text>
      <rect class="cursor" x="222" y="116" width="9" height="16" fill="#D97757"/>
    </g>
  </g>
  <g class="sans" text-anchor="middle">
    <text x="456" y="350" font-size="19" fill="#F0EEE6" font-weight="600">Deterministic split</text>
    <text x="456" y="376" font-size="16" fill="#A8A69E">a script, no model involved</text>
  </g>

  <!-- Stage 3: Haiku readers -->
  <g class="mono" font-size="15">
    <g transform="translate(676 178)">
      <g class="hop1"><g transform="scale(4.4)"><use href="#clawd"/></g></g>
      <rect x="64" y="2" width="128" height="26" rx="13" fill="#2A2926" stroke="#3D3B37"/>
      <text x="128" y="20" text-anchor="middle" fill="#F0EEE6">batch 1</text>
    </g>
    <g transform="translate(676 230)">
      <g class="hop2"><g transform="scale(4.4)"><use href="#clawd"/></g></g>
      <rect x="64" y="2" width="128" height="26" rx="13" fill="#2A2926" stroke="#3D3B37"/>
      <text x="128" y="20" text-anchor="middle" fill="#F0EEE6">batch 2</text>
    </g>
    <g transform="translate(676 282)">
      <g class="hop3"><g transform="scale(4.4)"><use href="#clawd"/></g></g>
      <rect x="64" y="2" width="128" height="26" rx="13" fill="#2A2926" stroke="#3D3B37"/>
      <text x="128" y="20" text-anchor="middle" fill="#F0EEE6">batch 3</text>
    </g>
  </g>
  <g class="sans" text-anchor="middle">
    <text x="772" y="350" font-size="19" fill="#F0EEE6" font-weight="600">Haiku reads, in parallel</text>
    <text x="772" y="376" font-size="16" fill="#A8A69E">facts and file:line, no opinions</text>
  </g>

  <!-- Stage 4: Opus -->
  <g transform="translate(940 210)">
    <g transform="scale(9)"><use href="#clawd"/></g>
    <g fill="#D97757">
      <rect class="think" x="104" y="-10" width="8" height="8"/>
      <rect class="think" x="118" y="-24" width="8" height="8" style="animation-delay:-0.5s"/>
      <rect class="think" x="132" y="-38" width="8" height="8" style="animation-delay:-1s"/>
    </g>
  </g>
  <g transform="translate(1100 176)">
    <rect width="120" height="146" rx="14" fill="#2A2926" stroke="#D97757" stroke-width="1.5"/>
    <text x="16" y="32" class="mono" font-size="15" fill="#F0EEE6">report.md</text>
    <rect x="16" y="50" width="88" height="7" rx="3.5" fill="#D97757" opacity="0.8"/>
    <rect x="16" y="68" width="70" height="7" rx="3.5" fill="#4A4843"/>
    <rect x="16" y="86" width="84" height="7" rx="3.5" fill="#4A4843"/>
    <circle cx="96" cy="120" r="12" fill="#D97757" opacity="0.18"/>
    <path d="M90 120.5l4 4 7-8" fill="none" stroke="#D97757" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="sans" text-anchor="middle">
    <text x="1092" y="350" font-size="19" fill="#F0EEE6" font-weight="600">Opus decides</text>
    <text x="1092" y="376" font-size="16" fill="#A8A69E">synthesis, trade-offs, verdict</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#D97757" stroke-width="3">
    <path class="flow" d="M262 250 L 314 250"/>
    <path class="flow" d="M594 250 L 652 250"/>
    <path class="flow" d="M884 250 L 926 250"/>
  </g>

  <!-- Where model tokens go -->
  <g class="sans">
    <rect x="60" y="420" width="1160" height="1" fill="#3D3B37"/>
    <text x="60" y="466" font-size="16" fill="#A8A69E">model tokens</text>
    <text x="60" y="490" font-size="13" fill="#6F6D66">(illustrative)</text>
    <text x="456" y="476" class="mono" font-size="22" fill="#F0EEE6" text-anchor="middle">0</text>
    <g fill="#D97757" opacity="0.55">
      <rect x="690" y="452" width="52" height="10" rx="5"/>
      <rect x="690" y="468" width="52" height="10" rx="5"/>
      <rect x="690" y="484" width="40" height="10" rx="5"/>
    </g>
    <text x="756" y="478" font-size="15" fill="#A8A69E">cheap rate</text>
    <rect x="1000" y="462" width="70" height="14" rx="7" fill="#D97757"/>
    <text x="1084" y="475" font-size="15" fill="#A8A69E">top rate, small input</text>
  </g>
</svg>
